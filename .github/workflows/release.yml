name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      # Optional. Without MACOS_CERT_P12 this is a no-op and the build is ad-hoc signed.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret set. Building ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a GUI prompt for keychain access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Resolve signing identity
        id: identity
        run: |
          NAME="$(security find-identity -v -p codesigning | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Signing as: ${NAME:-ad-hoc}"

      - name: Resolve version
        id: version
        run: |
          # Tag v1.2.3 -> 1.2.3. Manual runs get a placeholder.
          REF="${GITHUB_REF#refs/tags/v}"
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="$REF" ;;
            *) VERSION="0.0.0-dev" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build app bundle
        env:
          VD_SIGN_ID: ${{ steps.identity.outputs.name }}
          VD_VERSION: ${{ steps.version.outputs.version }}
        run: ./bundle.sh

      # Optional. Requires a Developer ID Application certificate; an Apple Development
      # certificate cannot be notarized and these secrets should stay unset.
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "No NOTARY_APPLE_ID secret set. Skipping notarization."
            exit 0
          fi
          ditto -c -k --keepParent VirtualDisplay.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple VirtualDisplay.app
          rm notarize.zip

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 VirtualDisplay.app
          codesign -d -r- VirtualDisplay.app

      # ditto, not zip: preserves the bundle's symlinks and extended attributes.
      - name: Package
        run: ditto -c -k --keepParent VirtualDisplay.app VirtualDisplay.zip

      - uses: actions/upload-artifact@v7
        with:
          name: VirtualDisplay
          path: VirtualDisplay.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: VirtualDisplay.zip
          generate_release_notes: true

      # Point the Homebrew cask at the release that was just published. Runs only on a
      # tag, and only when GH_RELEASE_TOKEN (write access to rapatao/homebrew-tap) is set.
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No GH_RELEASE_TOKEN secret set. Skipping Homebrew tap update."
            exit 0
          fi
          SHA="$(shasum -a 256 VirtualDisplay.zip | cut -d' ' -f1)"

          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/rapatao/homebrew-tap.git" tap
          mkdir -p tap/Casks

          cat > tap/Casks/virtual-display.rb <<CASK
          # This file was generated by the virtual-display release workflow. DO NOT EDIT.
          cask "virtual-display" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/VirtualDisplay.zip"
            name "Virtual Display"
            desc "Mirror a resizable screen region into a shareable window"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            livecheck do
              skip "Auto-generated on release."
            end

            depends_on macos: ">= :sonoma"

            app "VirtualDisplay.app"

            # The app is not notarized, so macOS quarantines the downloaded bundle and
            # Gatekeeper refuses to open it. Clearing the flag is what makes it launch.
            postflight do
              if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
                system_command "/usr/bin/xattr",
                               args: ["-dr", "com.apple.quarantine", "#{appdir}/VirtualDisplay.app"]
              end
            end

            zap trash: [
              "~/Library/Preferences/com.rapatao.virtual-display.plist",
              "~/Library/Saved Application State/com.rapatao.virtual-display.savedState",
            ]
          end
          CASK

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/virtual-display.rb
          git commit -m "virtual-display $VERSION" || { echo "No cask changes."; exit 0; }
          git push
